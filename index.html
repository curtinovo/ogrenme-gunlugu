<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Öğrenme Günlüğü</title>
  <style>
    :root {
      --bg: #faf7f2;
      --text: #2b2b2b;
      --muted: #6b6b6b;
      --accent: #c2410c;
      --card: #ffffff;
      --border: #e7e0d6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616;
        --text: #ece8e1;
        --muted: #9b958c;
        --accent: #fb923c;
        --card: #1f1f1f;
        --border: #2e2e2e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }
    h1 { font-size: 2.2rem; margin: 0 0 8px; }
    .alt-baslik { color: var(--muted); margin: 0 0 40px; }
    article {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    article time { color: var(--accent); font-size: 0.9rem; }
    article h2 { margin: 6px 0 8px; font-size: 1.3rem; }
    article p { margin: 0; }
    footer { color: var(--muted); font-size: 0.9rem; margin-top: 40px; }
  </style>
</head>
<body>
  <main>
    <h1>Öğrenme Günlüğü</h1>
    <p class="alt-baslik">Her gün öğrendiğim küçük bir şey.</p>

    <article>
      <time datetime="2026-10-08">8 Ekim 2026</time>
      <h2>GitHub'da ilk repo</h2>
      <p>Bugün GitHub'da ilk deposunu açtım ve Claude ile bağladım. "Project" ile "Repository" ayrı şeylermiş: depo kodun durduğu yer, project ise görev panosu.</p>
    </article>

    <footer>GitHub Pages ile yayınlanıyor.</footer>
  </main>
</body>
</html>
